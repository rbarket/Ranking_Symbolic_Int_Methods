experiment_name: "transformer_50k"

model:
  type: transformer
  d_model: 40
  layers: 4
  heads: 4
  dim_feedforward: 128
  dropout: 0.1
  activation: gelu
  max_seq_len: 1024

training:
  learning_rate: 0.01
  batch_size: 256
  epochs: 3
  weight_decay: 1e-6
  log_interval: 10
  resume_from: null
  n: 50000
  eval_n: 5000
  seed: 1998
  validation_fraction: 0.1
  split_seed: 1998

device: "cuda"

data:
  input_dir: "data/processed/airy"
  vocab_path: "data/vocab.json"
  num_workers: 4

paths:
  save_dir: "models/ranking/comparison_50k/transformer"
